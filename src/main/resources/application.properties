spring.application.name=feed

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/feed_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2001
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.address=0.0.0.0
server.port=8080

# Feed World Publications storage
# All PDFs + generated cover thumbnails are written under this folder (relative to where the app runs).
feedworld.storage.base-dir=storage/publications
# Shared secret required in the X-Admin-Key header to upload/update/delete publications, and to
# manage EPM events/gallery photos and view EPM registrations/volunteers (see the AdminEpm*
# controllers) - one app-wide admin secret rather than a separate one per feature.
# Change this before deploying anywhere shared.
feedworld.admin.upload-key=change-this-admin-key

# EPM gallery photos - admin-uploaded via AdminEpmGalleryController, served back through
# EpmGalleryController. Same on-disk-file + DB-row split as Feed World publications above.
epm.storage.gallery-dir=storage/epm/gallery

# Personal profile pictures - uploaded by the logged-in user via UserProfileController and shown
# in the navbar account button. Same on-disk-file + DB-column split as the folders above.
feedworld.storage.profile-images-dir=storage/profile-images

# Publication PDFs can be large (50+ pages) - raise the default multipart limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# JWT is a long-lived backstop (180 days) - actual session validity/logout is enforced via the
# UserSession table (see SessionService), so a device stays logged in until it is logged out,
# not until this expiry hits.
jwt.expiration=15552000000