spring.application.name=feed

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/feed_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=2001
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server configuration
server.address=0.0.0.0
server.port=8080

# Feed World Publications storage
# All PDFs + generated cover thumbnails are written under this folder (relative to where the app runs).
feedworld.storage.base-dir=storage/publications
# Whoever registers or logs in with this email address is automatically granted the ADMIN role
# (see UserServiceImpl). That one role is what SecurityConfig requires for every /api/admin/**
# route - Feed World publications and all EPM admin screens alike. Change this to the real admin's
# email before deploying anywhere shared.
feedworld.admin.email=admin@feedworld.com


# EPM images (EPM page hero/stats/calendar/carousel, gallery page sections, and the gallery's
# state -> district photo tree) - uploaded through the admin panel. Only the image FILES live in
# this folder; their names and metadata (caption, order, which block/district) live in the
# epm_gallery_images / epm_gallery_states / epm_gallery_districts tables, and every request reads
# the database first, then streams the file it names. Layout:
#   <block>/<file>                              e.g. epm-hero/, epm-moments/ (see EpmGalleryBlock)
#   epm-gallery/<state>/<cover file>            optional picture for a state card
#   epm-gallery/<state>/<district>/<file>       a district card's photos
# Files copied straight into these folders are picked up by the admin panel's "Scan storage
# folder" button (and once automatically on first startup - see EpmDataBootstrapRunner).
epm.storage.gallery-dir=storage/epm/gallery

# Personal profile pictures - uploaded by the logged-in user via UserProfileController and shown
# in the navbar account button. Same on-disk-file + DB-column split as the folders above.
feedworld.storage.profile-images-dir=storage/profile-images

# Publication PDFs can be large (50+ pages) - raise the default multipart limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# JWT is a long-lived backstop (180 days) - actual session validity/logout is enforced via the
# UserSession table (see SessionService), so a device stays logged in until it is logged out,
# not until this expiry hits.
jwt.expiration=15552000000